<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Atmosense</title>
</head>
<body>
    <h1>Paraiso Unip</h1>
    <div class="Subtitulo">
        <span class="bolinha"></span>
        <p class="subtitulo1">Estação Meteorológica em tempo real</p>
        <p class="subtitulo2">Brasil</p>
    </div>
    <div class="PagInteira">
        <div class="CantoEsquerdo">
            <div class="card1">
                <div class="topocard1">
                <h2>Umidade</h2> 
                <i class="fa-solid fa-droplet"></i>
                </div>
                <div class="valorUmidade">
                    <span class="UmidadeVal">13</span>
                    <span class="UmidadeVal2">%</span> 
                </div>   
                <p class="descriçãoUmidade">Ponto de condensação normal</p>
            </div> 
            <div class="card2">
                <div class="topocard2">
                <h2>Pressão Atmosférica</h2> 
                <i class="fa-solid fa-gauge"></i>
                </div>
                <div class="valorPressãoAtmosferica">
                    <span class="PressãoAtmosfericaVal">5005</span>
                    <span class="UnidadePressão">hPa</span> 
                </div>   
                <p class="descriçãoPressão">Estável</p>
            </div> 
            <div class="card3">
                <div class="topocard3">
                <h2>Qualidade do Ar</h2> 
                <i class="fa-solid fa-lungs"></i>
                </div>
                <div class="valorQualidadeAr">
                    <span class="QualidadeArVal">13</span>
                    <span class="UnidadeQualidadeAr">%</span> 
                </div>   
                <p class="descriçãoQualidadeAr">Ar em baixa qualidade</p>
            </div> 
            <div class="card4">
                <div class="topocard4">
                <h2>Presença de Gases</h2> 
                <i class="fa-solid fa-flask"></i>
                </div>
                <div class="valorPresençaGases">
                    <span class="PresençaGasesVal">Gases detectados</span>
                </div> 
                <p class="descriçãoPresençaGases">Alerta de gases</p>  
            </div> 
        </div>
        <div class="Centro">
            <div class="card5">
                <div class="topocard5">
                    <h2>TEMPERATURA</h2> 
                </div>
                <div class="valorTemperatura">
                    <span class="TemperaturaVal">13</span>
                    <span class="UnidadeTemperatura">°C</span> 
                    <i class="fa-solid fa-temperature-three-quarters"></i>
                </div>   
                <div class="rodapeTemperatura">
                    <span class="SensaçãoTemperatura">11°C</span>
                    <span class="descriçãoTemperatura">Sensação térmica</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
